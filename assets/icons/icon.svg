<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Фон -->
  <rect width="192" height="192" fill="#0b6cbf"/>

  <!-- Техническая сетка (слабая) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="32"  y1="0" x2="32"  y2="192"/>
    <line x1="64"  y1="0" x2="64"  y2="192"/>
    <line x1="96"  y1="0" x2="96"  y2="192"/>
    <line x1="128" y1="0" x2="128" y2="192"/>
    <line x1="160" y1="0" x2="160" y2="192"/>
    <line x1="0" y1="32"  x2="192" y2="32"/>
    <line x1="0" y1="64"  x2="192" y2="64"/>
    <line x1="0" y1="96"  x2="192" y2="96"/>
    <line x1="0" y1="128" x2="192" y2="128"/>
    <line x1="0" y1="160" x2="192" y2="160"/>
  </g>

  <!-- Пластина -->
  <rect x="52" y="64" width="88" height="76" rx="3"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>

  <!-- Отверстие -->
  <circle cx="96" cy="102" r="17"
          fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Осевые линии (оранжевые, штрих-пунктир) -->
  <g stroke="#ffb74d" stroke-width="2"
     stroke-dasharray="5 3 1 3" stroke-linecap="round">
    <line x1="96" y1="76"  x2="96" y2="128"/>
    <line x1="70" y1="102" x2="122" y2="102"/>
  </g>

  <!-- Размерная линия сверху -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="52"  y1="48" x2="52"  y2="58"/>
    <line x1="140" y1="48" x2="140" y2="58"/>
    <line x1="52"  y1="52" x2="140" y2="52"/>
  </g>
  <g fill="#ffffff">
    <polygon points="52,52 58,49 58,55"/>
    <polygon points="140,52 134,49 134,55"/>
  </g>
</svg>
